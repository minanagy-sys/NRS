# Nouvelage Daily Sales — nrs.nouvelage.clinic
#
# A site of its own. It adds two server blocks for this hostname only and
# touches nothing else: no edits to nginx.conf, no edits to any existing site,
# and no default_server claim — so api.nouvelage.clinic keeps answering exactly
# as it does today.

server {
    listen 80;
    listen [::]:80;
    server_name nrs.nouvelage.clinic;

    # Let's Encrypt renewals, served from a webroot only this site uses.
    location /.well-known/acme-challenge/ {
        root /var/www/nrs-acme;
    }

    location / { return 301 https://$host$request_uri; }
}

server {
    # nginx changed how HTTP/2 is enabled in 1.25.1: `http2 on;` replaced the
    # `http2` listen parameter, and each version rejects the other's syntax.
    # install.sh substitutes whichever this nginx understands.
    listen 443 ssl@HTTP2_PARAM@;
    listen [::]:443 ssl@HTTP2_PARAM@;
@HTTP2_DIRECTIVE@    server_name nrs.nouvelage.clinic;

    ssl_certificate     /etc/letsencrypt/live/nrs.nouvelage.clinic/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nrs.nouvelage.clinic/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:nrs_tls:10m;
    ssl_session_timeout 1d;

    # The app sets its own CSP, HSTS and cookie flags; nothing is added here that
    # could contradict them.
    client_max_body_size 16m;   # target schedules are uploaded through the admin screen

    access_log /var/log/nginx/nrs.access.log;
    error_log  /var/log/nginx/nrs.error.log;

    location / {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # The app trusts this to decide Secure cookies and whether to send HSTS.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        # A month refresh reads ~5,000 invoices from the MCP.
        proxy_read_timeout 180s;
        proxy_connect_timeout 10s;
    }
}
