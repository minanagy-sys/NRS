<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#58382C">
<title>Finance · Nouvelage</title>
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<link rel="stylesheet" href="/assets/app.css">
<link rel="stylesheet" href="/assets/finance.css">
</head>
<body>

<div class="cbar">
  <div class="cbar-row">


    <label class="fld">From <input type="date" id="from"></label>
    <label class="fld">To <input type="date" id="to"></label>
    <label class="fld">Stock as of <input type="date" id="asOf"></label>

    <button class="btn" id="load">Show</button>

    <span class="cbar-spacer"></span>
    <span class="cstat"><i class="dot" id="dot"></i><span id="status">…</span></span>
    <a class="btn ghost" href="/admin#sources">Data sources</a>
    <form method="post" action="/auth/logout" style="display:inline">
      <button class="btn ghost" type="submit">Sign out</button>
    </form>
  </div>
  <div class="err" id="err"></div>
</div>

<header class="header">
  <div class="brand">Nouvelage · Finance Suite</div>
  <h1>Money in, money out<em id="hPeriod">—</em></h1>
  <p class="header-sub" id="hSub">Collections, supplier payables, sold-versus-issued stock and expiry risk</p>
  <div class="hero-stats">
    <div class="hero-stat"><div class="lbl">Collected</div><div class="val" id="hNet">—<small>EGP net</small></div></div>
    <div class="hero-stat"><div class="lbl">Owed to suppliers</div><div class="val" id="hAp">—<small>EGP closing</small></div></div>
    <div class="hero-stat"><div class="lbl">Stock gap</div><div class="val" id="hGap">—<small>EGP at cost</small></div></div>
    <div class="hero-stat"><div class="lbl">Expiry at risk</div><div class="val" id="hRisk">—<small>EGP forecast</small></div></div>
  </div>
</header>
<div class="rangeline" id="rangeline">Loading…</div>

<div class="tabs-wrap"><div class="tabs">
  <button class="tab active" data-panel="collections"><span class="tab-num">01</span> Collections</button>
  <button class="tab" data-panel="payables"><span class="tab-num">02</span> Payables</button>
  <button class="tab" data-panel="recon"><span class="tab-num">03</span> Sold vs Issued</button>
  <button class="tab" data-panel="expiry"><span class="tab-num">04</span> Expiry Risk</button>
</div></div>

<div class="panel active" id="collections"></div>
<div class="panel" id="payables"></div>
<div class="panel" id="recon"></div>
<div class="panel" id="expiry"></div>

<!-- No finance-rules.js here on purpose: every verdict, bucket and cause label
     arrives already computed in /api/finance, so the page has nothing to decide
     and there is no second copy of the rules to drift. -->
<script src="/assets/shell.js"></script>
<script src="/assets/nav.js"></script>
<script src="/assets/rules.js"></script>
<script src="/assets/finance.js"></script>
</body>
</html>
