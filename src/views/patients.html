<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#58382C">
<title>Patients · Nouvelage</title>
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>

<div class="cbar" data-presets="mtd,lastmonth,quarter,ytd" data-preset="mtd">
  <!-- Moved into the shared bar by cbar.js. Lives here because it
       belongs to this report and would be noise on the other ten. -->
  <div class="cbar-extra"><div class="seg" id="basis" title="Which report's tier definition to rank on — they disagree">
      <button data-basis="report01" class="on">YTD tiers</button>
      <button data-basis="report06">Rolling 12m</button>
    </div></div>
</div>

<div class="header">
  <div class="brand">NOUVELAGE · PATIENTS · ODOO 18</div>
  <h1>Patients<em id="hPeriod"></em></h1>
  <div class="header-sub" id="hSub">Tiers, retention and service mix, on 2026 invoices.</div>
  <div class="hero-stats"><div class="hero-stat"><div class="lbl">Patients billed</div><div class="val" id="hPat">—</div><div class="unit">in range</div></div>
    <div class="hero-stat"><div class="lbl">New</div><div class="val" id="hNew">—</div><div class="unit">first 2026 invoice</div></div>
    <div class="hero-stat"><div class="lbl">Repeat rate</div><div class="val" id="hRep">—</div><div class="unit">returning share</div></div>
    <div class="hero-stat"><div class="lbl">Avg ticket</div><div class="val" id="hTk">—</div><div class="unit">EGP ex-VAT</div></div></div>
</div>

<div class="rangeline" id="rangeline">Loading…</div>

<div class="tabs-wrap"><div class="tabs"><button class="tab active" data-panel="tiers"><span class="tab-num">01</span> Tiers</button>
  <button class="tab" data-panel="retention"><span class="tab-num">02</span> New vs returning</button>
  <button class="tab" data-panel="mix"><span class="tab-num">03</span> Service mix</button>
  <button class="tab" data-panel="acq"><span class="tab-num">04</span> Acquisition</button>
  <button class="tab" data-panel="churn"><span class="tab-num">05</span> Churn &amp; recency</button></div></div>

<div class="panel active" id="tiers"></div>
<div class="panel" id="retention"></div>
<div class="panel" id="mix"></div>
<div class="panel" id="acq"></div>
<div class="panel" id="churn"></div>

<!-- The shared $/fmt/pc/esc, loaded before anything that uses them. -->
<script src="/assets/fmt.js"></script>
<script src="/assets/shell.js"></script>
<script src="/assets/nav.js"></script>
<script src="/assets/cbar.js"></script>
<script src="/assets/rules.js"></script>
<script src="/assets/patients.js"></script>
</body>
</html>
