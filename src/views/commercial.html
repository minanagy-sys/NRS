<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#58382C">
<title>Commercial · Nouvelage</title>
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>

<div class="cbar" data-presets="mtd,lastmonth,quarter,ytd" data-preset="mtd">
  <!-- Moved into the shared bar by cbar.js. Lives here because it
       belongs to this report and would be noise on the other ten. -->
  <div class="cbar-extra"><div class="seg" id="scope" title="Which entity to include">
      <button data-scope="all" class="on">All</button>
      <button data-scope="Nouvel Age">Nouvel Age</button>
      <button data-scope="ZAT">ZAT</button>
    </div></div>
</div>

<div class="header">
  <div class="brand">NOUVELAGE · COMMERCIAL · ODOO 18</div>
  <h1>Commercial view<em id="hPeriod"></em></h1>
  <div class="header-sub" id="hSub">The chain from booking to cash, on the parts Odoo can answer.</div>
  <div class="hero-stats"><div class="hero-stat"><div class="lbl">Bookings</div><div class="val" id="hBook">—</div><div class="unit">appointments</div></div>
    <div class="hero-stat"><div class="lbl">Attended</div><div class="val" id="hAtt">—</div><div class="unit">visits</div></div>
    <div class="hero-stat"><div class="lbl">Show rate</div><div class="val" id="hShow">—</div><div class="unit">attended of booked</div></div>
    <div class="hero-stat"><div class="lbl">Unresolved</div><div class="val" id="hPend">—</div><div class="unit">no outcome</div></div></div>
</div>

<div class="rangeline" id="rangeline">Loading…</div>

<div class="tabs-wrap"><div class="tabs"><button class="tab active" data-panel="funnel"><span class="tab-num">01</span> The funnel</button>
  <button class="tab" data-panel="ratios"><span class="tab-num">02</span> The ratios</button>
  <button class="tab" data-panel="bybranch"><span class="tab-num">03</span> Branch by branch</button></div></div>

<div class="panel active" id="funnel"></div>
<div class="panel" id="ratios"></div>
<div class="panel" id="bybranch"></div>

<!-- The shared $/fmt/pc/esc, loaded before anything that uses them. -->
<script src="/assets/fmt.js"></script>
<script src="/assets/shell.js"></script>
<script src="/assets/nav.js"></script>
<script src="/assets/cbar.js"></script>
<script src="/assets/rules.js"></script>
<script src="/assets/commercial.js"></script>
</body>
</html>
